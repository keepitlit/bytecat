name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13"]
        include:
          # 3.9 is the floor pyproject promises. setup-python has no 3.9
          # build for ubuntu-latest (26.04), so Linux tests it on 24.04.
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: macos-latest, python: "3.9" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # Stdlib only: the tier-3 checks skip without a model server or Chroma.
      - run: tests/run_all.sh
